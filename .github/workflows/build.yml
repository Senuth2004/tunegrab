name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean tunegrab.spec
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cp install-launcher.sh dist/Tunegrab/
          cp tunegrab/assets/tunegrab.svg dist/Tunegrab/
          tar -czf Tunegrab-linux-x86_64.tar.gz -C dist Tunegrab
      - name: Package Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Tunegrab -DestinationPath Tunegrab-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tunegrab-${{ matrix.platform }}-x86_64
          path: Tunegrab-${{ matrix.platform }}-x86_64.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Tunegrab-*
          path: release-files
          merge-multiple: true
      - name: Create source archive for the in-app updater
        run: git archive --format=zip --prefix=tunegrab/ "${GITHUB_REF_NAME}" -o release-files/tunegrab-source.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
